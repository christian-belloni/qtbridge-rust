[package]
name = "qt_ifaces"
version = "0.1.0"
edition.workspace = true
description = "Implementation of bridges between Qt item models and Rust objects"

[dependencies]
cxx.workspace = true
qtbridge-type-lib = { path = "../qtbridge-type-lib" }
qtbridge-runtime = { path = "../qtbridge-runtime" }

[build-dependencies]
cxx-build.workspace = true
qtbridge-build-common = { path = "../qtbridge-build-common" }
qt_type_gen = { path = "../../code_gen/qt_type_gen" }
