[package]
name = "qtbridge-interfaces"
version = "0.1.0"
edition.workspace = true
description = "QtBridge: Proxies and interfaces between Rust and Qt"

[dependencies]
cxx.workspace = true
qtbridge-type-lib = { path = "../qtbridge-type-lib" }
