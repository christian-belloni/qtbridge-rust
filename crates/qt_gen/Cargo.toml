[package]
name = "qt_gen"
version = "0.1.0"
edition.workspace = true
description = "Entry point for generative code"

[lib]
proc-macro = true

[dependencies]
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true
build_common = { path = "../build_common" }
qt_gen_common = { path = "../qt_gen_common" }
qt_type_lib = { path = "../qt_type_lib" }

[dev-dependencies]
pretty_assertions = "1"
insta = { version = "1", features = ["glob"] }
