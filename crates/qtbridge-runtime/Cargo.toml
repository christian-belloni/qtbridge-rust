[package]
name = "qtbridge-runtime"
links = "qtbridge-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Qt Bridge: bridging code to be run in applications."

[dependencies]
cxx.workspace = true
qtbridge-type-lib = { path = "../qtbridge-type-lib", version = "0.1.5" }
serde_json = { workspace = true, optional = true }

[build-dependencies]
cxx-build.workspace = true
qtbridge-build-utils = { path = "../qtbridge-build-utils", version = "0.1.5" }

[dev-dependencies]
qtbridge = { path = "../qtbridge", version = "0.1.5" }

[features]
serde_json = ["dep:serde_json"]
