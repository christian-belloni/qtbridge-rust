[workspace.package]
edition = "2024"
rust-version = "1.87.0"
version = "0.1.0"
repository = "ssh://codereview.qt-project.org:29418/qt/tqtc-qtbridges"

[workspace.dependencies]
cxx = { version = "1.0.158", features = ["c++17", "std"] }
cxx-build = { version = "1.0.158", features = [ "parallel" ] }
linkme = "0.3"
proc-macro2 = "1.0.95"
quote = "1.0.40"
syn = { version = "2.0.103", features = ["extra-traits", "full"] }

[workspace]
resolver = "2"

members = [
    "code_gen/qt_type_gen",
    "code_gen/qt_type_gen_lib",

    "crates/qtbridge",
    "crates/qtbridge-build-common",
    "crates/qtbridge-gen-common",
    "crates/qtbridge-gen",
    "crates/qtbridge-type-lib",
    "crates/qt_ifaces",
    "crates/qtbridge-runtime",
    "quicktest",
    "quicktest/quicktest_gen",
    "apps/hello_world",
    "apps/minimal_app",
    "test/tst_qobject_macro",
    "test/tst_qt_ifaces",
    "test/tst_metatype",
    "test/quick/tst_qobject",
    "test/quick/tst_qabstractitemmodel",
    "test/quick/tst_generic_itemmodel",
    "test/quick/tst_qresource",
    "test/quick/tst_qlistmodel",
    "test/quick/tst_qtablemodel",
    "test/quick/tst_qml_element",
]

[profile.release.build-override]
# In release mode build script may be running twice (unlike debug)
# because a package being dependency is built twice with different optimization settings.
# Hardcode optimization level to help cargo deduplicate dependencies and run build script only once.
opt-level = 3
