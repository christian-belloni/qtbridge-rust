[[test]]
name = "slot_return_tests"
path = "tests/slot_return_tests.rs"
harness = false

[[test]]
name = "slot_return_vec_tests"
path = "tests/slot_return_vec_tests.rs"
harness = false

[[test]]
name = "slot_vec_tests"
path = "tests/slot_vec_tests.rs"
harness = false

[[test]]
name = "signal_vec_tests"
path = "tests/signal_vec_tests.rs"
harness = false

[[test]]
name = "qml_method_invoker_tests"
path = "tests/qml_method_invoker_tests.rs"
harness = false
