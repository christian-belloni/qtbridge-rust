[package]
name = "tst_qobject_macro"
version.workspace = true
edition.workspace = true
description = "Tests for objects annotated with the `#[qobject]` macro."

[dependencies]
qtbridge = { path = "../../crates/qtbridge" }
qtbridge-type-lib = { path = "../../crates/qtbridge-type-lib" }
quicktest = { path = "../../quicktest" }

[[test]]
name = "property_nested_types_tests"
path = "tests/property_nested_types_tests.rs"
