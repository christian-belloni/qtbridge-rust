[package]
name = "bridge"
version = "0.1.0"
edition.workspace = true
description = "Means for creating a dynamic metaobject and associating it with a Rust object"

[dependencies]
cxx.workspace = true
qt_type_lib = { path = "../qt_type_lib" }

[build-dependencies]
build_common = { path = "../build_common" }
