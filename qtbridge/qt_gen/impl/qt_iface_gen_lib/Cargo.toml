# Note that this crate is not in use at the current point in time. The generated proxies were
# manually modified to work as they do now. However, this is a good starting point to start
# generating more interfaces automatically.

[package]
name = "qt_iface_gen_lib"
version = "0.1.0"
edition.workspace = true
description = "Code generation that produces code for QObject/QAbstractItemModel proxies in C++, makes bridges to Rust side for them and glues it with Rust object"

[dependencies]
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true
qt_gen_common = { path = "../qt_gen_common" }
